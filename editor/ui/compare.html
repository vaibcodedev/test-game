<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сравнение с окном игры</title>
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/fonts.css"><link rel="stylesheet" href="/styles/base.css"><link rel="stylesheet" href="/styles/scrollbar.css"><link rel="stylesheet" href="/styles/kit.css"><link rel="stylesheet" href="/styles/shop.css">
<style>body{display:grid;grid-template-columns:520px 1fr;gap:16px;padding:16px;height:100vh}
.win-stable{position:static;width:auto;max-height:none;height:100%}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<div class="panel win l win-stable"><h2><span>Конюший Ратибор (окно игры, разметка stable.ts)</span><button class="x" aria-label="Закрыть">×</button></h2>
<div class="tabs stable-tabs"><button class="tab" aria-selected="true">Все</button><button class="tab">Обычные</button><button class="tab">Редкие</button></div>
<div class="body"><p class="npc-say">«Добрый конь — половина победы. Выбирай: что по карману — про то и разговор.»</p>
<section class="sec"><h3 class="sec-h" style="color:var(--rare)">Редкие</h3><div class="st-cards">
<div class="st-card"><span class="st-icon"></span><div class="st-main"><div class="st-line st-name" style="color:var(--rare)">Боевой конь Сольгарда</div><div class="st-line st-sub">Редкий · Сольгард</div><div class="st-line st-sub">ур. 40 · скорость ×1,7</div><div class="st-line st-need"><span class="c-ok">реп. 1 200/1 000</span></div></div><div class="st-act"><button class="btn small price">Купить</button></div></div>
<div class="st-card locked"><span class="st-icon"></span><div class="st-main"><div class="st-line st-name" style="color:var(--rare)">Латный дестриэ</div><div class="st-line st-sub">Редкий · Сольгард</div><div class="st-line st-need"><span class="c-bad">реп. 300/2 500</span></div></div><div class="st-act"><button class="btn small price" disabled>Купить</button></div></div>
</div></section></div>
<div class="win-foot"><span class="win-foot-info">Репутация 1 200 · Знаки Полей 40</span></div></div>
<iframe src="/#mounts"></iframe>
</body></html>
