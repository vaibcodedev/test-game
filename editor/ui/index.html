<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор конфигов — Пепельный Предел</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/scrollbar.css">
  <link rel="stylesheet" href="/styles/kit.css">
  <link rel="stylesheet" href="/editor.css">
</head>
<body>
  <div class="m">
    <div class="top">
      <span class="logo">Конфиги</span>
      <button class="search-btn" id="search-btn" type="button"><span class="ico">⌕</span><span>Найти настройку: «агр», «скорость коня», «золото»…</span><kbd class="kbd">Ctrl K</kbd></button>
      <span class="grow"></span>
      <span class="chip warn" id="top-chip" hidden></span>
      <span class="chip dim">Пепельный Предел · data/*.json</span>
    </div>
    <div class="body2">
      <nav class="panel rail" id="rail" aria-label="Разделы"></nav>
      <main class="panel main">
        <div id="head" class="head"></div>
        <div id="content" class="content"></div>
      </main>
    </div>
    <div class="panel actbar">
      <span class="info" id="bar-info"></span>
      <span class="grow"></span>
      <button class="btn" id="b-diff" type="button">Что изменится…</button>
      <button class="btn" id="b-undo" type="button">Отменить всё</button>
      <button class="btn" id="b-check" type="button">Проверить</button>
      <button class="btn primary" id="b-save" type="button">Сохранить</button>
    </div>
  </div>
  <div id="search" class="ov" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
